[project]
name = "doctor-agent"
version = "0.2.0"
description = "Medical Multi-Agent System with RAG, Knowledge Governance, and Safety Evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"langchain-core>=0.3.0",
	"langgraph>=0.2.0",
	"qdrant-client>=1.14.0",
	"fastembed>=0.6.0",
	"fastapi>=0.115.0",
	"uvicorn>=0.34.0",
	"mcp>=1.9.0,<2",
	"pypdf>=5.0.0",
	"PyMySQL>=1.1.1",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.0.0",
	"pytest-asyncio>=0.21.0",
]
crewai = ["crewai>=1.15.0"]
nlp = [
	"ltp==4.2.14",
	"huggingface-hub>=0.34,<1.0",
	"transformers>=4.45,<5",
]

[project.scripts]
doctor-agent = "doctor_agent.cli:main"
agentic-rag-eval = "agentic_rag_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["doctor_agent*", "agentic_rag_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


